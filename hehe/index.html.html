<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Batwoman Ji</title>
<style>
    body {
        background-color: #ffd1dc; /* Baby pink background */
        color: #333333; 
        font-family: 'Courier New', Courier, monospace;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }

    /* Intro Screen Overlay */
    #intro-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffd1dc;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
    }
    
    .start-btn {
        background-color: #e60000;
        color: white;
        padding: 15px 40px;
        font-size: 1.5em;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(230,0,0,0.4);
        transition: transform 0.3s ease;
        animation: pulseStart 2s infinite;
    }

    .start-btn:hover {
        transform: scale(1.05);
    }

    @keyframes pulseStart {
        0% { transform: scale(1); box-shadow: 0 4px 15px rgba(230,0,0,0.4); }
        50% { transform: scale(1.05); box-shadow: 0 6px 20px rgba(230,0,0,0.6); }
        100% { transform: scale(1); box-shadow: 0 4px 15px rgba(230,0,0,0.4); }
    }
    
    /* Flower Animation Styles */
    #flowers-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }
    .flower {
        position: absolute;
        bottom: -50px;
        opacity: 0.6;
        user-select: none;
        animation: floatUp linear infinite;
    }
    @keyframes floatUp {
        0% { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(-110vh) rotate(360deg); }
    }

    .container {
        max-width: 700px;
        margin-top: 50px;
        padding-bottom: 50px;
        z-index: 1;
        position: relative;
        background: rgba(255, 209, 220, 0.5);
        padding: 30px;
        border-radius: 20px;
        display: none; /* Hidden until start button is clicked */
    }

    /* Photo Styles */
    .photo-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 30px;
        flex-wrap: wrap;
    }
    
    .polaroid {
        background-color: white;
        padding: 10px 10px 20px 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    .polaroid img {
        width: 150px;
        height: 150px;
        object-fit: cover;
    }

    .caption {
        margin-top: 15px;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        color: #333;
        font-size: 0.9em;
    }

    .polaroid:nth-child(1) { transform: rotate(-5deg); }
    .polaroid:nth-child(2) { transform: rotate(3deg); }
    .polaroid:nth-child(3) { transform: rotate(-4deg); }

    .polaroid:hover {
        transform: scale(1.1) rotate(0deg);
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        z-index: 10;
    }

    .heart-divider {
        color: #e60000;
        font-size: 1.2em;
        margin-bottom: 30px;
        letter-spacing: 2px;
    }
    .message {
        margin-bottom: 20px;
        font-size: 1.2em;
        line-height: 1.6;
        min-height: 1.6em;
        opacity: 0;
        font-weight: bold;
        animation: fadeIn 0.5s forwards;
    }
    @keyframes fadeIn {
        to { opacity: 1; }
    }
    .buttons {
        margin-top: 40px;
        display: none;
    }
    .action-btn {
        background-color: transparent;
        color: #e60000;
        border: 2px solid #e60000;
        padding: 12px 40px;
        margin: 0 15px;
        font-size: 1.2em;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.4);
    }
    .action-btn:hover {
        background-color: #e60000;
        color: #ffffff;
        box-shadow: 0 0 15px #ff6666;
    }
    #big-heart {
        color: #e60000;
        white-space: pre;
        font-size: 1.4em;
        line-height: 1.2;
        margin-top: 40px;
        display: none;
        text-shadow: 0 0 10px rgba(230, 0, 0, 0.4);
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
    .typing::after {
        content: '|';
        animation: blink 1s infinite;
    }
    @keyframes blink {
        50% { opacity: 0; }
    }
</style>
</head>
<body>

    <!-- Intro Screen to trigger audio -->
    <div id="intro-screen">
        <h2 style="color: #e60000; margin-bottom: 30px;">For Batwoman Ji...</h2>
        <button class="start-btn" onclick="startProposal()">Tap to open your surprise 💌</button>
    </div>

    <div id="flowers-container"></div>

    <!-- Hidden Audio Element -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="container" id="main-content">
        <div class="photo-container">
            <div class="polaroid">
                <img src="pic1.jpeg" alt="Photo 1">
                <div class="caption">The first page of us...</div>
            </div>
            <div class="polaroid">
                <img src="pic2.jpeg" alt="Photo 2">
                <div class="caption">A thousand memories later</div>
            </div>
            <div class="polaroid">
                <img src="pic3.jpeg" alt="Photo 3">
                <div class="caption">Let's write the rest together</div>
            </div>
        </div>

        <div class="heart-divider">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
        <div id="text-container"></div>
        
        <div class="buttons" id="action-buttons">
            <button class="action-btn" onclick="handleYes()">Yes</button>
            <button class="action-btn" onclick="handleNo()">No</button>
        </div>
        
        <div id="big-heart"></div>
    </div>

    <script>
        // --- Start Proposal Logic ---
        function startProposal() {
            // Hide the intro screen
            document.getElementById('intro-screen').style.display = 'none';
            // Show the main content
            document.getElementById('main-content').style.display = 'block';
            
            // Play the music!
            const music = document.getElementById('bg-music');
            music.volume = 0.5; // Sets volume to 50% so it's not too loud
            music.play().catch(e => console.log("Audio play failed:", e));

            // Start typing after a brief moment
            setTimeout(runInitialSequence, 1000);
        }

        // --- Floating Flowers Logic ---
        const emojis = ['🌷', '🌸', '🌼', '🌺', '🌷', '🌻', '🌹']; 
        const flowersContainer = document.getElementById('flowers-container');
        const numFlowers = 35; 

        for (let i = 0; i < numFlowers; i++) {
            let flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.fontSize = (Math.random() * 20 + 20) + 'px'; 
            flower.style.animationDuration = (Math.random() * 8 + 6) + 's'; 
            flower.style.animationDelay = (Math.random() * 5) + 's'; 
            
            flowersContainer.appendChild(flower);
        }

        // --- Proposal Logic ---
        const initialLines = [
            "I didn't know how to say this perfectly...",
            "I am not good at confessing but through this I am trying to confess my feelings for you....",
            "I don't just want to be someone who happens to be in your life.",
            "I want to be the one who makes you smile when you're looking at your phone.",
            "The one who is always there for you, no matter what.",
            "Batwoman Ji, will you do me the honor of being mine??"
        ];

        const heartArt = `   ❤️❤️❤️❤️❤️     ❤️❤️❤️❤️❤️   
 ❤️❤️❤️❤️❤️❤️❤️❤️❤️ ❤️❤️❤️❤️❤️❤️❤️❤️❤️ 
❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️
❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️
 ❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️ 
  ❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️  
    ❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️    
      ❤️❤️❤️❤️❤️❤️❤️❤️❤️      
        ❤️❤️❤️❤️❤️        
          ❤️          `;

        let noCount = 0;
        const textContainer = document.getElementById('text-container');
        const actionButtons = document.getElementById('action-buttons');
        const bigHeart = document.getElementById('big-heart');

        async function typeLine(text, delay=40) {
            const el = document.createElement('div');
            el.className = 'message typing';
            textContainer.appendChild(el);
            
            window.scrollTo(0, document.body.scrollHeight);

            for (let i = 0; i < text.length; i++) {
                el.innerHTML = text.substring(0, i + 1);
                await new Promise(r => setTimeout(r, delay));
            }
            
            el.classList.remove('typing');
            await new Promise(r => setTimeout(r, 800));
        }

        async function runInitialSequence() {
            for (let line of initialLines) {
                await typeLine(line);
            }
            actionButtons.style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function handleNo() {
            noCount++;
            actionButtons.style.display = 'none';
            
            const separator = document.createElement('div');
            separator.innerHTML = '<br><span style="color:#888;">---</span><br><br>';
            textContainer.appendChild(separator);
            
            if (noCount === 1) {
                await typeLine("I know this might be sudden, and I know I might not be perfect...");
                await typeLine("But my feelings for you are completely, undeniably real.");
                await typeLine("Please say yes? Just give me one chance to show you how much you mean to me.");
            } else if (noCount === 2) {
                await typeLine("Are you really sure? My heart actually sank reading that...");
                await typeLine("I promise to always be your safe place, to listen to you, and to care for you.");
                await typeLine("Please, Batwoman Ji... don't break my heart. Just say yes?");
            } else {
                await typeLine("Ouch... that really hurts. 💔");
                await typeLine("But I am not giving up on you. I'll just sit here with my fingers crossed until you say yes...");
            }
            
            actionButtons.style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function handleYes() {
            actionButtons.style.display = 'none';
            
            const separator = document.createElement('div');
            separator.innerHTML = '<br><span style="color:#888;">---</span><br><br>';
            textContainer.appendChild(separator);

            await typeLine("I LOVEYOU ❤️");
            await typeLine("BATWOMAN JI ❤️❤️");
            await typeLine("Thankyou for making my day, hehehehe. ❤️");
            
            bigHeart.textContent = heartArt;
            bigHeart.style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
            
            const extraEmojis = ['❤️', '💖', '💝', '💕', '🌷'];
            for (let i = 0; i < 30; i++) {
                let flower = document.createElement('div');
                flower.className = 'flower';
                flower.innerText = extraEmojis[Math.floor(Math.random() * extraEmojis.length)];
                flower.style.left = Math.random() * 100 + 'vw';
                flower.style.fontSize = (Math.random() * 20 + 20) + 'px';
                flower.style.animationDuration = (Math.random() * 4 + 3) + 's';
                flower.style.animationDelay = (Math.random() * 2) + 's';
                flowersContainer.appendChild(flower);
            }
        }
    </script>
</body>
</html>
